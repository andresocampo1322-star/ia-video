name: Pruebas de regresion de animaciones
on:
  pull_request:
    branches: [main, feat/locomocion-opcional-v1]
concurrency:
  group: animaciones-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar bibliotecas graficas Linux para Skia
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libgles2 libfontconfig1
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Pruebas deterministas del motor original y locomocion
        # La prueba Piper+Whisper descarga modelos externos y puede variar
        # decimas por ASR entre ejecuciones; se conserva en el repositorio.
        run: python -m pytest -q -k "not test_piper_captions_follow_asr_words"
      - name: Renderizar comparaciones MP4 del motor original
        run: |
          sudo apt-get install -y ffmpeg
          python -m tools.preview_locomotion
      - name: Publicar videos comparativos
        uses: actions/upload-artifact@v4
        with:
          name: comparacion-animaciones-01
          path: artifacts/comparacion-animaciones-01/*.mp4
          if-no-files-found: error
      - name: Renderizar continuidad y camara (legado versus opt-in)
        run: python -m tools.preview_cinematic_motion
      - name: Publicar videos y capturas de continuidad
        uses: actions/upload-artifact@v4
        with:
          name: comparacion-cinematica-02
          path: |
            artifacts/comparacion-cinematica-02/*.mp4
            artifacts/comparacion-cinematica-02/*.png
          if-no-files-found: error

