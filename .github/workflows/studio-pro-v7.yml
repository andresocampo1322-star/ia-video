name: Studio Pro v7 - pipeline automatico sin GPU
on:
  pull_request:
    branches:
      - feat/production-skills-references-v6
      - main
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Pure Python tests and end-to-end mock ComfyUI
        run: python -m pytest -q tests/test_studio_pro.py tests/test_studio_pro_edit.py tests/test_production_v7.py
      - name: Compile studio modules
        run: python -m compileall -q studio_pro
      - name: Verify original Stickman files unchanged in this PR
        run: |
          if git diff --name-only origin/feat/production-skills-references-v6...HEAD | grep -q '^stickman/'; then
            echo "ERROR: original Stickman files modified"; exit 1
          fi
      - name: Check sample pipeline config JSON
        run: python -m json.tool examples/studio_pro_v7/config.template.json >/dev/null
